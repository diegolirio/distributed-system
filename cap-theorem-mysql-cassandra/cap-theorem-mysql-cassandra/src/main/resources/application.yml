spring:
  application:
    name: cap-theorem-mysql-cassandra

  datasource:
    url: jdbc:mysql://localhost:3306/fiapdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
    username: fiap
    password: fiap123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: HikariMySQLPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_schema: fiapdb

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
