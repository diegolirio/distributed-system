<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Contratações')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('contratacoes')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content" th:fragment="content">
        <div class="toolbar">
            <h1>Contratações</h1>
            <button hx-get="/contratacoes/new" hx-target="#content" hx-swap="innerHTML">+ Nova</button>
        </div>
        <div th:if="${#lists.isEmpty(contratacoes)}" class="empty">Nenhuma contratação cadastrada.</div>
        <table th:unless="${#lists.isEmpty(contratacoes)}">
            <thead>
            <tr><th>Cliente</th><th>Produto</th><th>Data</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contratacoes}">
                <td th:text="${c.cliente.nome}"></td>
                <td th:text="${c.produto.nome}"></td>
                <td th:text="${c.dataContratacao}"></td>
                <td><span class="badge" th:text="${c.status}"></span></td>
                <td class="actions">
                    <button class="btn-light" th:hx-get="@{/contratacoes/{id}(id=${c.idContratacao})}" hx-target="#content" hx-swap="innerHTML">Ver</button>
                    <button class="btn-light" th:hx-get="@{/contratacoes/{id}/edit(id=${c.idContratacao})}" hx-target="#content" hx-swap="innerHTML">Editar</button>
                    <button class="btn-danger" th:hx-delete="@{/contratacoes/{id}(id=${c.idContratacao})}" hx-target="#content" hx-swap="innerHTML" hx-confirm="Excluir esta contratação?">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
