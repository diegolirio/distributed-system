<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Contas')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('contas')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content" th:fragment="content">
        <div class="toolbar">
            <h1>Contas</h1>
            <button hx-get="/contas/new" hx-target="#content" hx-swap="innerHTML">+ Nova</button>
        </div>
        <div th:if="${#lists.isEmpty(contas)}" class="empty">Nenhuma conta cadastrada.</div>
        <table th:unless="${#lists.isEmpty(contas)}">
            <thead>
            <tr><th>Número</th><th>Cliente</th><th>Tipo</th><th>Saldo</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contas}">
                <td th:text="${c.numero}"></td>
                <td th:text="${c.cliente.nome}"></td>
                <td th:text="${c.tipoConta}"></td>
                <td th:text="${c.saldo}"></td>
                <td><span class="badge" th:text="${c.status}"></span></td>
                <td class="actions">
                    <button class="btn-light" th:hx-get="@{/contas/{id}(id=${c.idConta})}" hx-target="#content" hx-swap="innerHTML">Ver</button>
                    <button class="btn-light" th:hx-get="@{/contas/{id}/edit(id=${c.idConta})}" hx-target="#content" hx-swap="innerHTML">Editar</button>
                    <button class="btn-danger" th:hx-delete="@{/contas/{id}(id=${c.idConta})}" hx-target="#content" hx-swap="innerHTML" hx-confirm="Excluir esta conta?">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
