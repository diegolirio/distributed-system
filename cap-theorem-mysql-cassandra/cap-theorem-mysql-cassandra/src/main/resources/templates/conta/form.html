<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Conta')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('contas')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content">
        <div th:fragment="form" class="card">
            <h1 th:text="${titulo}">Conta</h1>
            <form th:object="${form}" th:attr="hx-post=${hxUrl}" hx-target="#content" hx-swap="innerHTML">
                <label>Cliente
                    <select th:field="*{idCliente}">
                        <option value="">Selecione...</option>
                        <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                                th:text="${c.nome + ' — ' + c.cpf}"></option>
                    </select>
                    <span class="error" th:errors="*{idCliente}"></span>
                </label>
                <label>Número
                    <input type="text" th:field="*{numero}" maxlength="20"/>
                    <span class="error" th:errors="*{numero}"></span>
                </label>
                <label>Tipo de Conta
                    <select th:field="*{tipoConta}">
                        <option value="">Selecione...</option>
                        <option th:each="t : ${tiposConta}" th:value="${t}" th:text="${t}"></option>
                    </select>
                    <span class="error" th:errors="*{tipoConta}"></span>
                </label>
                <label>Saldo
                    <input type="number" step="0.01" th:field="*{saldo}"/>
                    <span class="error" th:errors="*{saldo}"></span>
                </label>
                <label>Status
                    <select th:field="*{status}">
                        <option value="">Selecione...</option>
                        <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"></option>
                    </select>
                    <span class="error" th:errors="*{status}"></span>
                </label>
                <div class="actions">
                    <button type="submit">Salvar</button>
                    <button type="button" class="btn-light" hx-get="/contas" hx-target="#content" hx-swap="innerHTML">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
