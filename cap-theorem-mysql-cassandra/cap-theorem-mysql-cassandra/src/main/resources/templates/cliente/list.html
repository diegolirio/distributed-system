<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('clientes')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content" th:fragment="content">
        <div class="toolbar">
            <h1>Clientes</h1>
            <button hx-get="/clientes/new" hx-target="#content" hx-swap="innerHTML">+ Novo</button>
        </div>
        <div th:if="${#lists.isEmpty(clientes)}" class="empty">Nenhum cliente cadastrado.</div>
        <table th:unless="${#lists.isEmpty(clientes)}">
            <thead>
            <tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Segmento</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.nome}"></td>
                <td th:text="${c.cpf}"></td>
                <td th:text="${c.email}"></td>
                <td><span class="badge" th:text="${c.segmento}"></span></td>
                <td class="actions">
                    <button class="btn-light" th:hx-get="@{/clientes/{id}(id=${c.idCliente})}" hx-target="#content" hx-swap="innerHTML">Ver</button>
                    <button class="btn-light" th:hx-get="@{/clientes/{id}/edit(id=${c.idCliente})}" hx-target="#content" hx-swap="innerHTML">Editar</button>
                    <button class="btn-danger" th:hx-delete="@{/clientes/{id}(id=${c.idCliente})}" hx-target="#content" hx-swap="innerHTML" hx-confirm="Excluir este cliente?">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
