<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('produtos')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content" th:fragment="content">
        <div class="toolbar">
            <h1>Produtos</h1>
            <button hx-get="/produtos/new" hx-target="#content" hx-swap="innerHTML">+ Novo</button>
        </div>
        <div th:if="${#lists.isEmpty(produtos)}" class="empty">Nenhum produto cadastrado.</div>
        <table th:unless="${#lists.isEmpty(produtos)}">
            <thead>
            <tr><th>Nome</th><th>Categoria</th><th>Taxa de Juros</th><th>Ativo</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.nome}"></td>
                <td><span class="badge" th:text="${p.categoria}"></span></td>
                <td th:text="${p.taxaJuros}"></td>
                <td th:text="${p.ativo} ? 'Sim' : 'Não'"></td>
                <td class="actions">
                    <button class="btn-light" th:hx-get="@{/produtos/{id}(id=${p.idProduto})}" hx-target="#content" hx-swap="innerHTML">Ver</button>
                    <button class="btn-light" th:hx-get="@{/produtos/{id}/edit(id=${p.idProduto})}" hx-target="#content" hx-swap="innerHTML">Editar</button>
                    <button class="btn-danger" th:hx-delete="@{/produtos/{id}(id=${p.idProduto})}" hx-target="#content" hx-swap="innerHTML" hx-confirm="Excluir este produto?">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
