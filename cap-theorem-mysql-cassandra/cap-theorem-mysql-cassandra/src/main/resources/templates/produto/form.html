<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Produto')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('produtos')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content">
        <div th:fragment="form" class="card">
            <h1 th:text="${titulo}">Produto</h1>
            <form th:object="${form}" th:attr="hx-post=${hxUrl}" hx-target="#content" hx-swap="innerHTML">
                <label>Nome
                    <input type="text" th:field="*{nome}"/>
                    <span class="error" th:errors="*{nome}"></span>
                </label>
                <label>Categoria
                    <select th:field="*{categoria}">
                        <option value="">Selecione...</option>
                        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                    </select>
                    <span class="error" th:errors="*{categoria}"></span>
                </label>
                <label>Taxa de Juros
                    <input type="number" step="0.0001" min="0" th:field="*{taxaJuros}"/>
                    <span class="error" th:errors="*{taxaJuros}"></span>
                </label>
                <label>Ativo
                    <input type="checkbox" th:field="*{ativo}"/>
                </label>
                <div class="actions">
                    <button type="submit">Salvar</button>
                    <button type="button" class="btn-light" hx-get="/produtos" hx-target="#content" hx-swap="innerHTML">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
