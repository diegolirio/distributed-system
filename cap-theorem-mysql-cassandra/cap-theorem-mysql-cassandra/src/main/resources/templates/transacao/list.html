<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Transações')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('transacoes')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content" th:fragment="content">
        <div class="toolbar">
            <h1>Transações</h1>
            <button hx-get="/transacoes/new" hx-target="#content" hx-swap="innerHTML">+ Nova</button>
        </div>
        <div th:if="${#lists.isEmpty(transacoes)}" class="empty">Nenhuma transação registrada.</div>
        <table th:unless="${#lists.isEmpty(transacoes)}">
            <thead>
            <tr><th>Data/Hora</th><th>Conta</th><th>Tipo</th><th>Valor</th><th>Produto</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transacoes}">
                <td th:text="${t.dataHora}"></td>
                <td th:text="${t.conta.numero}"></td>
                <td th:text="${t.tipoTransacao.descricao}"></td>
                <td th:text="${t.valor}"></td>
                <td th:text="${t.produto.nome}"></td>
                <td class="actions">
                    <button class="btn-light" th:hx-get="@{/transacoes/{id}(id=${t.idTransacao})}" hx-target="#content" hx-swap="innerHTML">Ver</button>
                    <button class="btn-danger" th:hx-delete="@{/transacoes/{id}(id=${t.idTransacao})}" hx-target="#content" hx-swap="innerHTML" hx-confirm="Excluir esta transação?">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
