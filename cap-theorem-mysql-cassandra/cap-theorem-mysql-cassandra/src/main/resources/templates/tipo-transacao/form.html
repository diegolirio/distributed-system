<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/menu :: head('Tipo de Transação')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('tipos-transacao')}"></nav>
<main>
    <div id="alerts"></div>
    <div id="content">
        <div th:fragment="form" class="card">
            <h1 th:text="${titulo}">Tipo de Transação</h1>
            <form th:object="${form}" th:attr="hx-post=${hxUrl}" hx-target="#content" hx-swap="innerHTML">
                <label>Descrição
                    <input type="text" th:field="*{descricao}" maxlength="60"/>
                    <span class="error" th:errors="*{descricao}"></span>
                </label>
                <label>Sinal
                    <select th:field="*{sinal}">
                        <option value="">Selecione...</option>
                        <option th:value="1">Crédito (+1)</option>
                        <option th:value="-1">Débito (-1)</option>
                    </select>
                    <span class="error" th:errors="*{sinal}"></span>
                </label>
                <div class="actions">
                    <button type="submit">Salvar</button>
                    <button type="button" class="btn-light" hx-get="/tipos-transacao" hx-target="#content" hx-swap="innerHTML">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
