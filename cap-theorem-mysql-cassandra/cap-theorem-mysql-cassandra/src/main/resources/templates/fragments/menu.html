<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' · CAP'">CAP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<nav th:fragment="menu(active)" class="menu">
    <a class="brand" th:href="@{/}">CAP · MySQL</a>
    <a th:href="@{/clientes}" th:classappend="${active == 'clientes'} ? 'active'">Clientes</a>
    <a th:href="@{/contas}" th:classappend="${active == 'contas'} ? 'active'">Contas</a>
    <a th:href="@{/produtos}" th:classappend="${active == 'produtos'} ? 'active'">Produtos</a>
    <a th:href="@{/contratacoes}" th:classappend="${active == 'contratacoes'} ? 'active'">Contratações</a>
    <a th:href="@{/tipos-transacao}" th:classappend="${active == 'tipos-transacao'} ? 'active'">Tipos de Transação</a>
    <a th:href="@{/transacoes}" th:classappend="${active == 'transacoes'} ? 'active'">Transações</a>
</nav>
</body>
</html>
