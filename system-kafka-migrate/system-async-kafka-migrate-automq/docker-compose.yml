version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: automq-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: automq-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin password;
      mc mb local/automq-data || true;
      exit 0;
      "

  automq:
    image: automqinc/automq:latest
    container_name: automq-broker
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      - KAFKA_S3_ENDPOINT=http://minio:9000
      - KAFKA_S3_ACCESS_KEY=admin
      - KAFKA_S3_SECRET_KEY=password
      - KAFKA_S3_REGION=us-east-1
      - KAFKA_S3_BUCKET=automq-data
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092

volumes:
  minio-data:
